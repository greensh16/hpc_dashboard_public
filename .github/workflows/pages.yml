name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/build_docs.py
      - scripts/build_logger_downloads.py
      - .github/workflows/pages.yml
  gollum:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Markdown renderer
        run: python -m pip install 'Markdown==3.9'
      - name: Fetch published wiki
        run: git clone --depth 1 https://github.com/greensh16/hpc_dashboard_public.wiki.git "$RUNNER_TEMP/wiki"
      - name: Fetch logger-rs wiki
        run: git clone --depth 1 https://github.com/greensh16/logger-rs.wiki.git "$RUNNER_TEMP/logger-wiki"
      - name: Build site and documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R docs/. "$RUNNER_TEMP/site/"
          python scripts/build_docs.py "$RUNNER_TEMP/wiki" "$RUNNER_TEMP/site"
          python scripts/build_docs.py "$RUNNER_TEMP/logger-wiki" "$RUNNER_TEMP/site" logger-rs
          python scripts/build_logger_downloads.py "$RUNNER_TEMP/site"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
